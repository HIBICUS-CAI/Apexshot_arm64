name: Ubuntu 26.04 ARM64 build

on:
  push:
    branches: ['chore/ubuntu-26.04-arm64-build']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu-26.04-arm64.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'capture-overlay/**'
      - 'tests/**'
      - 'data/**'
      - 'po/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-26.04-arm64-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Native ARM64 release build and tests
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Ubuntu version and native architecture
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          mkdir -p verification
          {
            cat /etc/os-release
            uname -m
            dpkg --print-architecture
            git rev-parse HEAD
          } | tee verification/environment.txt

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config binutils file \
            libgtk-4-dev libgtk4-layer-shell-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libpipewire-0.3-dev libtesseract-dev \
            libxkbcommon-dev libx11-dev libxtst-dev libwayland-dev libdbus-1-dev \
            qtbase5-dev libqt5x11extras5-dev gettext
          pkg-config --modversion gtk4 gtk4-layer-shell-0 Qt5Widgets \
            gstreamer-1.0 libpipewire-0.3 tesseract | tee verification/dependency-versions.txt

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc -vV | tee verification/rustc.txt
          rustc -vV | grep -Fx 'host: aarch64-unknown-linux-gnu'

      # Deliberately build from scratch: no Cargo target cache or cross compiler.
      # Default features retain Tesseract OCR and the Qt5 C++ capture helper.
      - name: Build release binaries
        run: cargo build --locked --release --verbose 2>&1 | tee verification/build.log

      - name: Verify AArch64 binaries and shared libraries
        run: |
          set -euo pipefail
          for binary in apexshot apexshot-capture; do
            path="target/release/$binary"
            test -x "$path"
            file "$path" | tee "verification/$binary.file.txt"
            readelf -h "$path" | tee "verification/$binary.elf.txt"
            grep -Eq 'Machine:.*AArch64' "verification/$binary.elf.txt"
            ldd "$path" | tee "verification/$binary.ldd.txt"
            if grep -q 'not found' "verification/$binary.ldd.txt"; then
              exit 1
            fi
          done
          tar -C target/release -czf verification/apexshot-ubuntu-26.04-arm64.tar.gz \
            apexshot apexshot-capture locale
          sha256sum verification/apexshot-ubuntu-26.04-arm64.tar.gz \
            > verification/SHA256SUMS

      - name: Run tests without a desktop session
        run: cargo test --locked --jobs 2 -- --test-threads=1 2>&1 | tee verification/tests.log

      - name: Check Rust formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets 2>&1 | tee verification/clippy.log

      - name: Upload binaries and verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apexshot-ubuntu-26.04-arm64-${{ github.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 14
